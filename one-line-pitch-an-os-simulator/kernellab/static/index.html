<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KernelLab</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body><main><header><p class="eyebrow">OS ALGORITHM LAB</p><h1>KernelLab</h1><p>Run reproducible operating-system experiments, then compare the recorded results.</p></header>
<section class="panel"><h2>Experiment runner</h2><div class="controls"><label>Module <select id="module"></select></label><label>Algorithm <select id="algorithm"></select></label><button id="run">Run workload</button></div><label class="workload-label">Workload JSON <textarea id="params" spellcheck="false"></textarea></label><pre id="output">Choose an experiment, review the workload, and run it.</pre></section>
<section class="grid"><div class="panel"><h2>Metrics</h2><canvas id="metrics"></canvas></div><div class="panel"><h2>Stored history</h2><div id="history">Loading...</div></div></section>
</main><script src="/static/app.js"></script></body></html>
