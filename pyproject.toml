[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernellab"
version = "1.0.0"
description = "A pure-Python operating-systems simulator with a FastAPI dashboard and SQLite experiment history."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Ruturaj Abhijeet Joshi"}]
dependencies = [
  "fastapi==0.115.6",
  "psutil==6.1.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.3.4"]

[tool.setuptools]
packages = ["kernellab"]

[tool.setuptools.package-data]
kernellab = ["static/*.css", "static/*.html", "static/*.js"]
